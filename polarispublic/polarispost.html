<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Details - Polaris FC</title>
    <style>
        :root {
            --primary-color: #0d47a1;
            --secondary-color: #1976d2;
            --dark-color: #1a202c;
            --light-bg: #f4f7f6;
            --card-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--light-bg);
            color: #333;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 40px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 2.2rem;
            letter-spacing: 1px;
        }

        header p {
            margin: 5px 0 0 0;
            font-size: 1rem;
            color: #e3f2fd;
        }

        .container {
            max-width: 800px;
            margin: -30px auto 40px auto;
            padding: 0 20px;
            flex-grow: 1;
            width: 100%;
            box-sizing: border-box;
        }

        .post-card {
            background: #ffffff;
            border-radius: 8px;
            padding: 35px;
            box-shadow: var(--card-shadow);
            border-left: 6px solid var(--primary-color);
        }

        .post-card.event {
            border-left-color: #2e7d32;
        }

        .badge {
            padding: 5px 12px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .badge-post { background-color: #e3f2fd; color: #0d47a1; }
        .badge-event { background-color: #e8f5e9; color: #2e7d32; }

        h2 {
            color: var(--primary-color);
            margin-top: 0;
            font-size: 1.8rem;
        }

        .meta-info {
            background: #f8fafc;
            padding: 15px;
            border-radius: 6px;
            margin: 20px 0;
            font-size: 0.95rem;
            border: 1px solid #e2e8f0;
        }

        .meta-info div {
            margin-bottom: 5px;
        }

        .meta-info div:last-child {
            margin-bottom: 0;
        }

        .content-body {
            margin-top: 25px;
            font-size: 1.1rem;
            white-space: pre-wrap;
            color: #2d3748;
        }

        .back-btn {
            display: inline-block;
            margin-top: 30px;
            background-color: var(--primary-color);
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 5px;
            font-weight: 600;
            transition: background 0.2s ease;
        }

        .back-btn:hover {
            background-color: #052c65;
        }

        footer {
            text-align: center;
            padding: 20px;
            background-color: var(--dark-color);
            color: white;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <header>
        <h1>POLARIS POST & NEWS</h1>
        <p>Kisii Teaching and Referral Hospital (KTRH)</p>
    </header>

    <div class="container">
        <div id="postContainer" class="post-card">
            <p style="text-align: center; color: #666; font-size: 1.1rem;">Loading post content...</p>
        </div>
        <a href="polarismain1.html" class="back-btn">&larr; Back to Dashboard</a>
    </div>

    <footer>
        <p>&copy; 2026 Polaris FC - Kisii Teaching & Referral Hospital (KTRH). All rights reserved.</p>
    </footer>

    <!-- FIREBASE POST LOADER SCRIPT -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCvr_0yXQGVG6k_JTi1PMVnSxJHNcx4rwU",
            authDomain: "polaris-project-16599.firebaseapp.com",
            databaseURL: "https://polaris-project-16599-default-rtdb.firebaseio.com",
            projectId: "polaris-project-16599",
            storageBucket: "polaris-project-16599.firebasestorage.app",
            messagingSenderId: "109438346449",
            appId: "1:109438346449:web:0c6783f03972bf72d11f00",
            measurementId: "G-0387WMREMC"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const urlParams = new URLSearchParams(window.location.search);
        const postId = urlParams.get('id');
        const container = document.getElementById('postContainer');

        if (!postId) {
            container.innerHTML = `
                <h3 style="color: #c53030;">Missing Reference</h3>
                <p>No post ID was specified in the URL address bar.</p>
            `;
        } else {
            const dbRef = ref(db);
            get(child(dbRef, `polaris_published_content/${postId}`)).then((snapshot) => {
                if (snapshot.exists()) {
                    const item = snapshot.val();
                    const isEvent = item.type === 'event';
                    
                    if (isEvent) {
                        container.classList.add('event');
                    }

                    container.innerHTML = `
                        <span class="badge ${isEvent ? 'badge-event' : 'badge-post'}">${isEvent ? 'Upcoming Event' : 'News Update'}</span>
                        <h2>${item.title}</h2>
                        ${isEvent ? `
                            <div class="meta-info">
                                <div><strong>📅 Date:</strong> ${item.date || 'TBD'}</div>
                                <div><strong>⏰ Time:</strong> ${item.time || 'TBD'}</div>
                                <div><strong>📍 Location:</strong> ${item.location || 'TBD'}</div>
                            </div>
                        ` : `<p style="font-size: 0.9rem; color: #718096; margin-bottom: 20px;">Published on: ${item.date || 'Recent'}</p>`}
                        <div class="content-body">${item.content}</div>
                    `;
                } else {
                    container.innerHTML = `
                        <h3 style="color: #c53030;">Post Not Found</h3>
                        <p>This entry may have been deleted, or the reference ID is incorrect.</p>
                    `;
                }
            }).catch((error) => {
                console.error("Firebase retrieval error:", error);
                container.innerHTML = `
                    <h3 style="color: #c53030;">Connection Error</h3>
                    <p>Failed to retrieve content from the database. Please check your network connection.</p>
                `;
            });
        }
    </script>
</body>
</html>
