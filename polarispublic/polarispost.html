<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polaris FC - Latest Posts & Upcoming Events</title>
    <style>
        :root {
            --primary-color: #0d47a1;
            --secondary-color: #1976d2;
            --accent-color: #00e676;
            --dark-color: #1a202c;
            --light-bg: #f4f7f6;
            --card-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--light-bg);
            color: #333;
            line-height: 1.6;
        }

        header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 40px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 2.5rem;
            letter-spacing: 1px;
        }

        header p {
            font-size: 1.1rem;
            margin-top: 8px;
            color: #e3f2fd;
        }

        .container {
            max-width: 1100px;
            margin: -20px auto 40px auto;
            padding: 0 20px;
        }

        .feed-controls {
            background: #ffffff;
            border-radius: 8px;
            padding: 15px 20px;
            box-shadow: var(--card-shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: none;
            border: 2px solid var(--primary-color);
            color: var(--primary-color);
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn.active, .tab-btn:hover {
            background-color: var(--primary-color);
            color: white;
        }

        .controls-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .live-status {
            font-size: 0.85rem;
            color: #666;
            white-space: nowrap;
        }

        .search-box {
            padding: 8px 15px;
            border: 1px solid #ccc;
            border-radius: 20px;
            font-size: 0.95rem;
            width: 250px;
            max-width: 100%;
        }

        .feed-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(320px, 100%), 1fr));
            gap: 25px;
        }

        .feed-card {
            background: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease-in-out;
        }

        .feed-card:hover {
            transform: translateY(-5px);
        }

        .card-type-badge {
            display: inline-block;
            padding: 4px 10px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 4px;
            margin-bottom: 10px;
            align-self: flex-start;
        }

        .badge-post {
            background-color: #e3f2fd;
            color: #0d47a1;
        }

        .badge-event {
            background-color: #e8f5e9;
            color: #2e7d32;
        }

        .card-content {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .card-title {
            margin: 0 0 10px 0;
            color: var(--dark-color);
            font-size: 1.3rem;
        }

        .card-meta {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 15px;
        }

        .card-body {
            font-size: 0.95rem;
            color: #444;
            flex-grow: 1;
            margin-bottom: 15px;
        }

        .card-body p {
            margin: 0;
        }

        .event-details {
            background-color: #f8fafc;
            border-left: 3px solid #2e7d32;
            padding: 10px 12px;
            border-radius: 0 5px 5px 0;
            font-size: 0.88rem;
            margin-bottom: 15px;
        }

        .event-details p {
            margin: 4px 0;
        }

        .empty-feed {
            text-align: center;
            grid-column: 1 / -1;
            padding: 50px 20px;
            background: white;
            border-radius: 8px;
            box-shadow: var(--card-shadow);
            color: #666;
        }

        footer {
            text-align: center;
            padding: 20px;
            background-color: var(--dark-color);
            color: white;
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <header>
        <h1>POLARIS FC - NEWS & EVENTS</h1>
        <p>Stay updated with the latest club announcements, match fixtures, and hospital tournaments.</p>
    </header>

    <div class="container">

        <div class="feed-controls">
            <div class="tabs">
                <button class="tab-btn active" data-filter="all">All Updates</button>
                <button class="tab-btn" data-filter="post">News & Posts</button>
                <button class="tab-btn" data-filter="event">Upcoming Events</button>
            </div>

            <div class="controls-right">
                <span class="live-status" id="liveStatus">⚪ Connecting…</span>
                <input type="text" id="searchInput" class="search-box" placeholder="Search posts or events...">
            </div>
        </div>

        <div class="feed-grid" id="feedContainer">
            <div class="empty-feed"><p>Loading latest updates...</p></div>
        </div>

    </div>

    <footer>
        <p>&copy; 2026 Polaris FC - Kisii Teaching & Referral Hospital (KTRH). All rights reserved.</p>
    </footer>

    <!-- FIREBASE REAL-TIME SYNC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // USE THE EXACT SAME CONFIG AS THE ADMIN PAGE AND THE MAIN PUBLIC PAGE
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const feedContainer = document.getElementById('feedContainer');
        const searchInput = document.getElementById('searchInput');
        const tabButtons = document.querySelectorAll('.tab-btn');
        const liveStatus = document.getElementById('liveStatus');

        let currentFilter = 'all';
        let allItems = []; // kept in memory and updated live from Firebase

        // Escape user text before inserting into HTML
        function esc(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // "2026-09-21" -> "21 Sep 2026"; other text (e.g. "Sep 21, 2026", "TBD") is shown as-is
        function fmtDate(d) {
            if (/^\d{4}-\d{2}-\d{2}$/.test(d || '')) {
                const dt = new Date(d + 'T00:00:00');
                return dt.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
            }
            return d || 'TBD';
        }

        // "16:00" -> "4:00 PM"; free text like "4:00 PM EAT" is shown as-is
        function fmtTime(t) {
            const m = /^(\d{1,2}):(\d{2})$/.exec(t || '');
            if (!m) return t;
            const h = parseInt(m[1], 10);
            return `${((h + 11) % 12) + 1}:${m[2]} ${h >= 12 ? 'PM' : 'AM'}`;
        }

        // Render posts/events into the page
        function renderFeed(message) {
            if (message) {
                feedContainer.innerHTML = `<div class="empty-feed"><p>${esc(message)}</p></div>`;
                return;
            }

            const searchTerm = searchInput.value.toLowerCase();

            const filteredItems = allItems.filter(item => {
                const matchesTab = currentFilter === 'all' || item.type === currentFilter;
                const matchesSearch = (item.title || '').toLowerCase().includes(searchTerm) ||
                                      (item.content || '').toLowerCase().includes(searchTerm);
                return matchesTab && matchesSearch;
            });

            feedContainer.innerHTML = '';

            if (filteredItems.length === 0) {
                feedContainer.innerHTML = `
                    <div class="empty-feed">
                        <h3>No posts or events found</h3>
                        <p>Check back later for new announcements from the Polaris FC management.</p>
                    </div>
                `;
                return;
            }

            filteredItems.forEach(item => {
                const card = document.createElement('div');
                card.className = 'feed-card';

                const isEvent = item.type === 'event';
                const badgeText = isEvent ? 'Upcoming Event' : 'News & Post';
                const badgeClass = isEvent ? 'badge-event' : 'badge-post';

                card.innerHTML = `
                    <div class="card-content">
                        <span class="card-type-badge ${badgeClass}">${badgeText}</span>
                        <h2 class="card-title">${esc(item.title)}</h2>
                        <div class="card-meta">${isEvent ? 'Event' : 'Posted'} ${esc(fmtDate(item.date))}${item.author ? ' by ' + esc(item.author) : ''}</div>

                        ${isEvent ? `
                            <div class="event-details">
                                <p>📅 <strong>Date:</strong> ${esc(fmtDate(item.date))}</p>
                                ${item.time ? `<p>⏰ <strong>Time:</strong> ${esc(fmtTime(item.time))}</p>` : ''}
                                ${item.location ? `<p>📍 <strong>Venue:</strong> ${esc(item.location)}</p>` : ''}
                            </div>
                        ` : ''}

                        <div class="card-body">
                            <p>${esc(item.content).replace(/\n/g, '<br>')}</p>
                        </div>
                    </div>
                `;

                feedContainer.appendChild(card);
            });
        }

        // Tab filter switching
        tabButtons.forEach(btn => {
            btn.addEventListener('click', function () {
                tabButtons.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentFilter = this.getAttribute('data-filter');
                renderFeed();
            });
        });

        // Search input handling
        searchInput.addEventListener('input', () => renderFeed());

        // Connect to Firebase
        try {
            if (firebaseConfig.apiKey === 'YOUR_API_KEY') {
                throw new Error('Firebase is not configured yet. Paste the same firebaseConfig used in your admin page.');
            }

            const app = initializeApp(firebaseConfig);
            const db = getDatabase(app);

            // Live connection indicator
            onValue(ref(db, '.info/connected'), (snap) => {
                liveStatus.textContent = snap.val() ? '🟢 Live' : '🔴 Offline';
            });

            // REAL-TIME FEED: fires immediately whenever the admin publishes or deletes something
            onValue(ref(db, 'polaris_published_content'), (snapshot) => {
                const data = snapshot.val() || {};
                allItems = Object.entries(data)
                    .map(([id, item]) => ({ id, ...item }))
                    .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)); // newest first
                renderFeed();
            }, (error) => {
                console.error('Feed error:', error);
                renderFeed('Could not load updates right now. Please try again later.');
            });

        } catch (err) {
            console.error(err);
            liveStatus.textContent = '🔴 Not connected';
            renderFeed(err.message);
        }
    </script>
</body>
</html>
