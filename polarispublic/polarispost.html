<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polaris FC - Admin Post Portal</title>
    <style>
        :root {
            --primary-color: #0d47a1;
            --secondary-color: #1976d2;
            --accent-color: #00e676;
            --dark-color: #1a202c;
            --light-bg: #f4f7f6;
            --card-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--light-bg);
            color: #333;
            line-height: 1.6;
        }

        header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 2.2rem;
        }

        header p {
            margin: 5px 0 0 0;
            color: #e3f2fd;
        }

        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .admin-card {
            background: #ffffff;
            border-radius: 8px;
            padding: 30px;
            box-shadow: var(--card-shadow);
            margin-bottom: 30px;
        }

        .admin-card h2 {
            margin-top: 0;
            color: var(--primary-color);
            border-bottom: 2px solid #e3f2fd;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--dark-color);
        }

        input[type="text"],
        input[type="date"],
        input[type="time"],
        select,
        textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
        }

        textarea {
            resize: vertical;
            height: 120px;
        }

        .event-fields {
            background: #f8fafc;
            padding: 15px;
            border-radius: 6px;
            border-left: 4px solid #2e7d32;
            margin-bottom: 20px;
            display: none;
        }

        .event-fields.active {
            display: block;
        }

        .btn-submit {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s ease;
            width: 100%;
        }

        .btn-submit:hover {
            background-color: var(--secondary-color);
        }

        .alert {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
            font-weight: bold;
            text-align: center;
        }

        .alert-success {
            background-color: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #c8e6c9;
        }

        .alert-error {
            background-color: #ffebee;
            color: #c62828;
            border: 1px solid #ffcdd2;
        }

        footer {
            text-align: center;
            padding: 20px;
            background-color: var(--dark-color);
            color: white;
        }
    </style>
</head>
<body>

    <header>
        <h1>Polaris FC - Admin Portal</h1>
        <p>Publish live news updates and upcoming events to the public feed.</p>
    </header>

    <div class="container">
        
        <div class="admin-card">
            <h2>Create New Post or Event</h2>
            
            <div id="statusAlert" class="alert"></div>

            <form id="postForm">
                <div class="form-group">
                    <label for="postType">Update Type</label>
                    <select id="postType" required>
                        <option value="post">News & Announcement Post</option>
                        <option value="event">Upcoming Event / Match</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="postTitle">Title</label>
                    <input type="text" id="postTitle" placeholder="e.g., Weekend Match vs KTRH Staff FC" required>
                </div>

                <div class="form-group">
                    <label for="postAuthor">Author / Department</label>
                    <input type="text" id="postAuthor" placeholder="e.g., Polaris FC Management" required>
                </div>

                <!-- Conditional Event Fields -->
                <div id="eventFieldsContainer" class="event-fields">
                    <div class="form-group">
                        <label for="eventDate">Event Date</label>
                        <input type="date" id="eventDate">
                    </div>
                    <div class="form-group">
                        <label for="eventTime">Event Time</label>
                        <input type="time" id="eventTime">
                    </div>
                    <div class="form-group">
                        <label for="eventLocation">Venue / Location</label>
                        <input type="text" id="eventLocation" placeholder="e.g., KTRH Grounds">
                    </div>
                </div>

                <div class="form-group">
                    <label for="postContent">Content / Description</label>
                    <textarea id="postContent" placeholder="Enter full announcement details here..." required></textarea>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">Publish to Live Feed</button>
            </form>
        </div>

    </div>

    <footer>
        <p>&copy; 2026 Polaris FC - Kisii Teaching & Referral Hospital (KTRH). All rights reserved.</p>
    </footer>

    <!-- FIREBASE REALTIME DATABASE SCRIPT -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // REPLACE THESE PLACEHOLDERS WITH YOUR ACTUAL FIREBASE CREDENTIALS
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const postForm = document.getElementById('postForm');
        const postTypeSelect = document.getElementById('postType');
        const eventFieldsContainer = document.getElementById('eventFieldsContainer');
        const statusAlert = document.getElementById('statusAlert');
        const submitBtn = document.getElementById('submitBtn');

        // Toggle visibility of event fields based on selection
        postTypeSelect.addEventListener('change', function() {
            if (this.value === 'event') {
                eventFieldsContainer.classList.add('active');
            } else {
                eventFieldsContainer.classList.remove('active');
            }
        });

        // Handle Form Submission
        postForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            submitBtn.disabled = true;
            submitBtn.textContent = 'Publishing...';

            const type = postTypeSelect.value;
            const title = document.getElementById('postTitle').value.trim();
            const author = document.getElementById('postAuthor').value.trim();
            const content = document.getElementById('postContent').value.trim();
            
            // Format current date nicely if regular post date isn't explicitly filled
            const todayStr = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
            
            let dateVal = todayStr;
            let timeVal = '';
            let locationVal = '';

            if (type === 'event') {
                const rawDate = document.getElementById('eventDate').value;
                if (rawDate) {
                    dateVal = new Date(rawDate).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
                }
                timeVal = document.getElementById('eventTime').value;
                locationVal = document.getElementById('eventLocation').value.trim();
            }

            try {
                // Reference to polaris_published_content node
                const postsRef = ref(db, 'polaris_published_content');
                const newPostRef = push(postsRef);

                await set(newPostRef, {
                    type: type,
                    title: title,
                    author: author,
                    date: dateVal,
                    time: timeVal,
                    location: locationVal,
                    content: content,
                    createdAt: Date.now()
                });

                // Show Success message
                showAlert('Successfully published to the live feed!', 'success');
                postForm.reset();
                eventFieldsContainer.classList.remove('active');

            } catch (error) {
                console.error("Error writing data: ", error);
                showAlert('Failed to publish. Check your Firebase credentials or console network tab.', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Publish to Live Feed';
            }
        });

        function showAlert(message, type) {
            statusAlert.textContent = message;
            statusAlert.className = `alert alert-${type}`;
            statusAlert.style.display = 'block';

            setTimeout(() => {
                statusAlert.style.display = 'none';
            }, 5000);
        }
    </script>
</body>
</html>
